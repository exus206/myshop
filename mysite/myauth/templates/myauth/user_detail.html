<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        .info { border: 1px solid #ddd; padding: 20px; border-radius: 5px; background: #f9f9f9; }
        .avatar { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 3px solid #4CAF50; }
        .no-avatar { width: 150px; height: 150px; border-radius: 50%; background: #ddd; display: flex; align-items: center; justify-content: center; color: #666; }
    </style>
</head>
<body>
    <div class="info">
        <h2>{{ profile_user.username }}</h2>

        {% if profile.avatar %}
            <img src="{{ profile.avatar.url }}" alt="Аватар" class="avatar">
        {% else %}
            <div class="no-avatar">Нет аватара</div>
        {% endif %}

        <p><strong>Email:</strong> {{ profile_user.email|default:"Не указан" }}</p>
        <p><strong>О себе:</strong> {{ profile.bio|default:"Не указано" }}</p>

        {% if can_edit %}
            <p><a href="{% url 'myauth:profile_update' profile_user.pk %}">✏ Изменить профиль</a></p>
        {% endif %}

        <p><a href="{% url 'myauth:user_list' %}">← К списку</a></p>
    </div>
</body>
</html>
