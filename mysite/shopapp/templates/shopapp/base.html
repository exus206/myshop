<!-- shopapp/templates/shopapp/base.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мой магазин{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .product {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .navigation {
            margin: 20px 0;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
        .navigation a {
            margin: 0 10px;
            color: #4CAF50;
            text-decoration: none;
        }
        .navigation a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>{% block header %}Магазин{% endblock %}</h1>
    </div>

    <div class="navigation">
        <a href="/shop/">Главная</a>
        <a href="/shop/products/">Товары</a>
        <a href="/shop/orders/">Заказы</a>
        <a href="/shop/upload/">Загрузка файла</a>
        <a href="/shop/files/">Файлы</a>
    </div>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <p>&copy; {% now "Y" %} MyShop. Все права защищены.</p>
    </footer>
</body>
</html>
